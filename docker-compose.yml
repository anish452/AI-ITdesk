services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aidesk
      POSTGRES_PASSWORD: aidesk
      POSTGRES_DB: aidesk
    ports:
      - "5434:5432"
    volumes:
      - aidesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidesk -d aidesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aidesk_pg:
